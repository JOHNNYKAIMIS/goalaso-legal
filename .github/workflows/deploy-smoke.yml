name: deploy-smoke

# Κλάση G05 (docs/failure-catalogue/G05-live-diverges-from-main.md): το ζωντανό site σερβίρει byte-προς-byte το main.
# Το push/PR το καλύπτει το quality.yml· αυτό εδώ πιάνει το drift — ρύθμιση του Pages που άλλαξε χωρίς commit.
# Τρέχει μόνο από το default branch (περιορισμός του schedule).

on:
  schedule:
    - cron: "17 6 * * *" # καθημερινά 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "deploy:check — live = main"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: "deploy:check — κάθε *.html του origin/main ταυτίζεται με το live, χωρίς CDN cache"
        run: node scripts/deploy-check.mjs
        env:
          DEPLOY_CHECK_TIMEOUT: "120"
